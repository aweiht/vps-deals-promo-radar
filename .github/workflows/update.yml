name: Update official VPS offers

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.ilang/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: official-offer-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate deterministic behavior and configuration
        run: python -m unittest discover -s tests -v
      - name: Read official sources
        id: scrape
        continue-on-error: true
        run: python scraper.py
      - name: Build and validate public output
        run: |
          python build.py
          python verify.py
      - name: Commit real observation updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official offer observations'
            git push origin HEAD:main
          fi
      - name: Report failed sources
        if: steps.scrape.outcome == 'failure'
        run: |
          echo 'One or more official sources could not be checked. Their last observations have been marked stale and the site rebuilt. See scraper output.'
          exit 1
